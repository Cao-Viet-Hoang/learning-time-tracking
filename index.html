<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Cadence — plan, track and review your learning time." />
    <meta name="theme-color" content="#f6f6f4" />
    <title>Learning Time Tracker</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="modulepreload" href="js/app.js" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var prefs = JSON.parse(localStorage.getItem("ltt:prefs") || "{}");
        if (prefs.theme === "light" || prefs.theme === "dark") document.documentElement.dataset.theme = prefs.theme;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/views.css" />
  </head>
  <body>
    <div id="app" class="app is-auth">
      <div class="boot" role="status" aria-live="polite">
        <span class="brand__mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="sr-only">Loading your workspace…</span>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">This app needs JavaScript enabled.</p>
    </noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
